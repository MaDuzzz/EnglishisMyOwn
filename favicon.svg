<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Monogram E Gradient -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Terminal Prompt Chevron Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.85" />

  <!-- Background Subtle Grid/Tech Accents -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 12" stroke-opacity="0.25" />
  
  <!-- Central Icon Graphic: Stylized Futuristic E + Terminal Chevron (>) + Speech Crest -->
  <g filter="url(#softShadow)">
    <!-- Vertical Spine of E with Speech Bubble Curve -->
    <path d="M148 136 C148 122.7 158.7 112 172 112 L204 112 C217.3 112 228 122.7 228 136 L228 376 C228 389.3 217.3 400 204 400 L172 400 C158.7 400 148 389.3 148 376 Z" fill="url(#eGrad)" />

    <!-- Top Bar of E -->
    <path d="M220 112 L344 112 C357.3 112 368 122.7 368 136 C368 149.3 357.3 160 344 160 L220 160 Z" fill="url(#eGrad)" />

    <!-- Middle Bar: Tech Terminal Prompt Chevron (>) & Progress Beam -->
    <g filter="url(#neonGlow)">
      <path d="M228 232 L312 232 C318 232 324 235 328 240 L346 256 L328 272 C324 277 318 280 312 280 L228 280 Z" fill="url(#chevronGrad)" />
      <!-- Forward Arrow Head -->
      <polygon points="352,242 376,256 352,270 360,256" fill="#39d353" />
    </g>

    <!-- Bottom Bar of E with Code Bracket Accent -->
    <path d="M220 352 L344 352 C357.3 352 368 362.7 368 376 C368 389.3 357.3 400 344 400 L220 400 Z" fill="url(#eGrad)" />

    <!-- Little Terminal Cursor Dot / Pulse Light -->
    <circle cx="396" cy="256" r="10" fill="#39d353" filter="url(#neonGlow)" />
  </g>
</svg>

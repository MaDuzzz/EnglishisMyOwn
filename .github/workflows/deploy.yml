name: Deploy to GitHub Pages with Firestore Secrets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets into Configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG || secrets.FIREBASECONFIG || secrets.firebaseConfig || secrets.FIREBASE_SECRET || secrets.FIREBASE }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.API_KEY || secrets.apiKey }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || secrets.AUTH_DOMAIN || secrets.authDomain }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.PROJECT_ID || secrets.projectId }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || secrets.STORAGE_BUCKET || secrets.storageBucket }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || secrets.MESSAGING_SENDER_ID || secrets.messagingSenderId }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || secrets.APP_ID || secrets.appId }}
        run: |
          python3 -c '
          import os, json, re, sys

          raw_cfg = os.environ.get("FIREBASE_CONFIG", "").strip()
          cfg = {}
          keys = ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"]

          # 1. Thử parse JSON tiêu chuẩn
          if raw_cfg:
              try:
                  parsed = json.loads(raw_cfg)
                  if isinstance(parsed, dict) and parsed.get("apiKey"):
                      cfg = parsed
                      print("✅ Đã parse thành công FIREBASE_CONFIG dạng JSON.")
              except Exception:
                  pass

          # 2. Nếu không phải JSON chuẩn (ví dụ copy nguyên const firebaseConfig = { ... } từ Firebase Console)
          if (not cfg or not cfg.get("apiKey")) and raw_cfg:
              extracted = {}
              for k in keys:
                  m = re.search(r"[\x22\x27]?" + k + r"[\x22\x27]?\s*:\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]", raw_cfg)
                  if m:
                      extracted[k] = m.group(1).strip()
              if extracted.get("apiKey"):
                  cfg = extracted
                  print("✅ Đã trích xuất thành công FIREBASE_CONFIG từ cú pháp JavaScript Object.")

          # 3. Fallback: Nếu không có FIREBASE_CONFIG, kiểm tra từng biến môi trường đơn lẻ
          if not cfg or not cfg.get("apiKey"):
              individual = {
                  "apiKey": os.environ.get("FIREBASE_API_KEY", "").strip(),
                  "authDomain": os.environ.get("FIREBASE_AUTH_DOMAIN", "").strip(),
                  "projectId": os.environ.get("FIREBASE_PROJECT_ID", "").strip(),
                  "storageBucket": os.environ.get("FIREBASE_STORAGE_BUCKET", "").strip(),
                  "messagingSenderId": os.environ.get("FIREBASE_MESSAGING_SENDER_ID", "").strip(),
                  "appId": os.environ.get("FIREBASE_APP_ID", "").strip()
              }
              if individual.get("apiKey"):
                  cfg = individual
                  print("✅ Đã nạp thành công các biến bí mật FIREBASE_* đơn lẻ.")

          # 4. Kiểm tra kết quả
          if cfg.get("apiKey"):
              prefix = cfg["apiKey"][:6]
              print(f"::notice::✅ Đã cấu hình Firebase thành công với apiKey: {prefix}***")
          else:
              print("::warning::⚠️ Không tìm thấy Firebase apiKey trong Secrets! Trang web sẽ hiển thị thông báo yêu cầu cấu hình Secret.")

          filepath = "js/firebase-config.js"
          with open(filepath, "r", encoding="utf-8") as f:
              code = f.read()

          replacement = f"export const FIREBASE_CONFIG = {json.dumps(cfg, indent=2)};"
          new_code = re.sub(r"export const FIREBASE_CONFIG = \{.*?\};", replacement, code, flags=re.DOTALL)

          with open(filepath, "w", encoding="utf-8") as f:
              f.write(new_code)
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vocabulary & Sync to Cloud Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_ADMIN_CREDENTIALS || secrets.GCP_SA_KEY }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG || secrets.FIREBASECONFIG || secrets.firebaseConfig || secrets.FIREBASE_SECRET || secrets.FIREBASE }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.API_KEY || secrets.apiKey }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.PROJECT_ID || secrets.projectId }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
        run: |
          node scripts/sync-firestore.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

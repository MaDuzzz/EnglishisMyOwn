<!DOCTYPE html>
<html lang="vi" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>English is My Own - Nền Tảng Học Tiếng Anh & IT LMS Cá Nhân</title>
  <meta name="description" content="Nền tảng tự học tiếng Anh giao tiếp công việc và luyện chứng chỉ IT với AI & Kỷ luật Spaced Repetition">
  <meta name="referrer" content="no-referrer">

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" type="image/png" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css?v=4.8">

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Pre-auth State Setup (Ẩn hoàn toàn thanh bar điều hướng khi chưa đăng nhập) -->
  <script>
    (function() {
      try {
        if (localStorage.getItem('eimo_auth_user')) {
          document.documentElement.classList.add('user-authenticated');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    /* Ẩn hoàn toàn thanh điều hướng desktop & mobile khi chưa đăng nhập */
    html:not(.user-authenticated) #desktop-nav-bar,
    html:not(.user-authenticated) #ios-bottom-bar {
      display: none !important;
    }
  </style>

</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ==================== HEADER THANH ĐIỀU HƯỚNG ==================== -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 transition-colors ios-header" style="padding-top: max(calc(env(safe-area-inset-top, 0px) + 10px), 54px);">
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        
        <!-- Logo & Brand (Click để tải lại trang) -->
        <div id="btn-header-logo" class="flex items-center space-x-2.5 cursor-pointer group logo-brand-container shrink-0 active:scale-95 transition-transform select-none" role="button" tabindex="0" title="Tải lại trang (Reload)" onclick="if(window.navigator?.vibrate)window.navigator.vibrate(10);window.location.reload();">
          <div class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl overflow-hidden shadow-md shadow-indigo-500/20 group-hover:shadow-indigo-500/40 transition-all flex items-center justify-center bg-slate-900 border border-slate-700/60">
            <img src="./favicon.svg" alt="English is My Own Logo" class="w-full h-full object-contain logo-letter-e select-none pointer-events-none">
          </div>
          <div>
            <span class="text-base sm:text-lg md:text-xl font-black tracking-tight text-slate-900 dark:text-white">EnglishIs<span class="text-indigo-600 dark:text-indigo-400">MyOwn</span></span>
          </div>
        </div>

        <!-- Navigation Tabs (Center) - Desktop Only (Chỉ hiện khi đã đăng nhập) -->
        <nav id="desktop-nav-bar" class="hidden md:flex items-center space-x-1 p-1 bg-slate-100 dark:bg-slate-800/60 rounded-2xl border border-slate-200/80 dark:border-slate-700/60" style="display: none;">
          <button data-tab="vocab" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-500/20">
            <span>📇</span>
            <span>Luyện Từ Vựng</span>
          </button>
          <button data-tab="analytics" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-700/60 hover:text-slate-900 dark:hover:text-white">
            <span>📊</span>
            <span>Kỷ Luật & Heatmap</span>
          </button>
          <button data-tab="courses" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-700/60 hover:text-slate-900 dark:hover:text-white">
            <span>📚</span>
            <span>Khoá Học</span>
          </button>
          <button data-tab="dictionary" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/70 dark:hover:bg-slate-700/60 hover:text-slate-900 dark:hover:text-white">
            <span>📖</span>
            <span>Sổ Tay</span>
          </button>
        </nav>

        <!-- Right Side: Streak, Level Badge, Auth & Settings -->
        <div class="flex items-center space-x-1.5 sm:space-x-2.5 shrink-0">
          <!-- Streak Indicator (Chỉ hiện khi đã đăng nhập) -->
          <div id="header-streak-badge" class="hidden px-2.5 py-1 rounded-xl text-xs font-black bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-900 text-amber-600 dark:text-amber-400 shadow-sm items-center shrink-0" title="Số ngày duy trì kỷ luật học tập liên tục">
            <span>🔥</span><span class="mx-0.5 font-bold">0</span><span class="hidden sm:inline ml-1 font-semibold text-slate-500 dark:text-slate-400">ngày</span>
          </div>

          <!-- Level & Rank Progression Badge (Clickable to open analytics - hidden on mobile when not ranked) -->
          <button id="btn-retake-placement-header" class="hidden sm:flex px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:opacity-80 transition-all items-center space-x-2 shrink-0">
            <span>Chưa xếp lớp</span>
          </button>

          <!-- Google Auth Action Button & User Menu -->
          <div id="auth-container" class="shrink-0 flex items-center relative">
            <button id="btn-auth-action" type="button" class="cursor-pointer px-3 sm:px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-500/25 transition-all flex items-center space-x-1.5 active:scale-95 shrink-0" title="Đăng nhập Google để đồng bộ dữ liệu Cloud Firestore">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Đăng nhập</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="flex-1 w-full max-w-5xl mx-auto px-3 sm:px-6 lg:px-8 pt-2 sm:pt-6 pb-10 flex flex-col min-w-0 max-w-full overflow-x-hidden">
    <div id="main-content-area" class="flex-1 flex flex-col w-full min-w-0 max-w-full overflow-x-hidden">
      <!-- Nội dung động sẽ được nạp qua js/app.js -->
    </div>
  </main>

  <!-- ==================== iOS GITHUB MOBILE FLUID DOCKED BOTTOM BAR (Chỉ hiện khi đã đăng nhập) ==================== -->
  <nav id="ios-bottom-bar" class="hidden md:hidden fixed z-50 bottom-0 left-0 right-0 w-full bg-white/95 dark:bg-[#161b22]/95 backdrop-blur-2xl border-t border-slate-200/90 dark:border-white/10 select-none shadow-[0_-4px_20px_rgba(0,0,0,0.06)] dark:shadow-[0_-4px_24px_rgba(0,0,0,0.4)]" style="padding-bottom: max(env(safe-area-inset-bottom, 0px), 12px);">
    <div class="relative max-w-md mx-auto px-2 pt-1.5 pb-0.5">
      
      <!-- Fluid Spring Glider Pill -->
      <div id="ios-bubble-glider" class="absolute top-1.5 bottom-1 pointer-events-none" style="width: calc((100% - 16px) / 4); left: 8px; transform: translate3d(0%, 0, 0);">
        <div id="ios-bubble-glider-pill" class="w-full h-full rounded-2xl bg-slate-200/75 dark:bg-[#21262d] border border-slate-300/60 dark:border-slate-700/70 shadow-sm"></div>
      </div>

      <!-- Tab Buttons Grid -->
      <div class="relative z-10 grid grid-cols-4 items-center h-[50px]">
        <!-- 1. Vocab Tab -->
        <button data-tab="vocab" data-tab-index="0" class="ios-tab-btn flex flex-col items-center justify-center h-full w-full group active:scale-95 transition-transform duration-100" aria-label="Từ Vựng">
          <div class="tab-icon-wrap flex items-center justify-center transition-all duration-300 text-indigo-600 dark:text-[#58a6ff] scale-105">
            <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="15" height="15" rx="3" fill="currentColor" fill-opacity="0.18" />
              <path d="M7 2h11a3 3 0 0 1 3 3v11" />
              <path d="M6 10h7M6 14h4" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-bold mt-0.5 tracking-tight transition-colors text-indigo-600 dark:text-[#58a6ff]">Từ Vựng</span>
        </button>

        <!-- 2. Analytics Tab -->
        <button data-tab="analytics" data-tab-index="1" class="ios-tab-btn flex flex-col items-center justify-center h-full w-full group active:scale-95 transition-transform duration-100" aria-label="Kỷ Luật">
          <div class="tab-icon-wrap flex items-center justify-center transition-all duration-300 text-slate-500 dark:text-[#8b949e]">
            <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h16" />
              <rect x="6" y="11" width="3" height="6" rx="1" fill="currentColor" fill-opacity="0.18" />
              <rect x="11" y="6" width="3" height="11" rx="1" fill="currentColor" fill-opacity="0.18" />
              <rect x="16" y="8" width="3" height="9" rx="1" fill="currentColor" fill-opacity="0.18" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-0.5 tracking-tight transition-colors text-slate-500 dark:text-[#8b949e]">Kỷ Luật</span>
        </button>

        <!-- 3. Courses Tab -->
        <button data-tab="courses" data-tab-index="2" class="ios-tab-btn flex flex-col items-center justify-center h-full w-full group active:scale-95 transition-transform duration-100" aria-label="Khoá Học">
          <div class="tab-icon-wrap flex items-center justify-center transition-all duration-300 text-slate-500 dark:text-[#8b949e]">
            <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z" fill="currentColor" fill-opacity="0.18" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-0.5 tracking-tight transition-colors text-slate-500 dark:text-[#8b949e]">Khoá Học</span>
        </button>

        <!-- 4. Dictionary Tab -->
        <button data-tab="dictionary" data-tab-index="3" class="ios-tab-btn flex flex-col items-center justify-center h-full w-full group active:scale-95 transition-transform duration-100" aria-label="Sổ Tay">
          <div class="tab-icon-wrap flex items-center justify-center transition-all duration-300 text-slate-500 dark:text-[#8b949e]">
            <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" fill="currentColor" fill-opacity="0.18" />
              <path d="M6 6h10M6 10h8" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-0.5 tracking-tight transition-colors text-slate-500 dark:text-[#8b949e]">Sổ Tay</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- PWA Service Worker Registration with Instant Auto-Update -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            reg.update();
            console.log('✅ ServiceWorker đã sẵn sàng:', reg.scope);
          })
          .catch(err => console.log('ServiceWorker lỗi:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- ES Modules Entrypoint -->
  <script type="module" src="./js/app.js?v=6.46"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>English is My Own - Nền Tảng Học Tiếng Anh & IT LMS Cá Nhân</title>
  <meta name="description" content="Nền tảng tự học tiếng Anh giao tiếp công việc và luyện chứng chỉ IT với AI & Kỷ luật Spaced Repetition">

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" type="image/png" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css?v=3.6">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-[100dvh] flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white overscroll-y-none">

  <!-- ==================== HEADER THANH ĐIỀU HƯỚNG ==================== -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 transition-colors ios-header" style="padding-top: calc(max(env(safe-area-inset-top, 0px), 54px) + 16px);">
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        
        <!-- Logo & Brand -->
        <div class="flex items-center space-x-2.5 cursor-pointer group logo-brand-container shrink-0">
          <div class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl overflow-hidden shadow-md shadow-indigo-500/20 group-hover:shadow-indigo-500/40 transition-all flex items-center justify-center bg-slate-900 border border-slate-700/60">
            <img src="./favicon.svg" alt="English is My Own Logo" class="w-full h-full object-contain logo-letter-e select-none pointer-events-none">
          </div>
          <div>
            <span class="text-base sm:text-lg md:text-xl font-black tracking-tight text-slate-900 dark:text-white">EnglishIs<span class="text-indigo-600 dark:text-indigo-400">MyOwn</span></span>
          </div>
        </div>

        <!-- Navigation Tabs (Center) - Desktop Only -->
        <nav class="hidden md:flex items-center space-x-1 p-1 bg-slate-100 dark:bg-slate-800/60 rounded-2xl border border-slate-200/80 dark:border-slate-700/60">
          <button data-tab="vocab" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 bg-indigo-600 text-white shadow-md shadow-indigo-500/20">
            <span>📇</span>
            <span>Luyện Từ Vựng</span>
          </button>
          <button data-tab="analytics" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50">
            <span>📊</span>
            <span>Kỷ Luật & Heatmap</span>
          </button>
          <button data-tab="courses" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50">
            <span>📚</span>
            <span>Khoá Học</span>
          </button>
          <button data-tab="dictionary" class="nav-tab-btn px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50">
            <span>📖</span>
            <span>Sổ Tay</span>
          </button>
        </nav>

        <!-- Right Side: Streak, Level Badge, Auth & Settings -->
        <div class="flex items-center space-x-1.5 sm:space-x-2.5 shrink-0">
          <!-- Streak Indicator -->
          <div id="header-streak-badge" class="px-2.5 py-1 rounded-xl text-xs font-black bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-900 text-amber-600 dark:text-amber-400 shadow-sm flex items-center shrink-0" title="Số ngày duy trì kỷ luật học tập liên tục">
            <span>🔥</span><span class="mx-0.5 font-bold">0</span><span class="hidden sm:inline ml-1 font-semibold text-slate-500 dark:text-slate-400">ngày</span>
          </div>

          <!-- Level & Rank Progression Badge (Clickable to open analytics - hidden on mobile when not ranked) -->
          <button id="btn-retake-placement-header" class="hidden sm:flex px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:opacity-80 transition-all items-center space-x-2 shrink-0">
            <span>Chưa xếp lớp</span>
          </button>

          <!-- Google Auth Action -->
          <button id="btn-auth-action" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-slate-700 shrink-0">
            <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 flex items-center space-x-1">
              <span>👤</span>
              <span class="hidden sm:inline">Đăng nhập</span>
            </span>
          </button>

          <!-- Settings Button -->
          <button id="btn-open-settings" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shrink-0" title="Cài đặt Firebase">
            ⚙️
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-6 pb-28 md:pb-8 flex flex-col justify-center">
    <div id="main-content-area" class="flex-1 flex flex-col justify-center">
      <!-- Nội dung động sẽ được nạp qua js/app.js -->
    </div>
  </main>

  <!-- ==================== FOOTER (ẨN TRÊN MOBILE ĐỂ TRÁNH RÁC GIAO DIỆN) ==================== -->
  <footer class="hidden md:block border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400 dark:text-slate-600">
    <p>English is My Own • Static Web LMS Cá Nhân • Thiết kế cho Dân Kỹ Thuật IT</p>
  </footer>

  <!-- ==================== FIREBASE SETTINGS MODAL ==================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 md:p-8 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-black text-slate-800 dark:text-white flex items-center space-x-2">
          <span>⚙️</span>
          <span>Cài Đặt Firebase</span>
        </h3>
        <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg font-bold">
          ✕
        </button>
      </div>

      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">
        Nhập thông tin Firebase Web App của bạn để bật tính năng <strong>Đăng nhập Google</strong> và <strong>Đồng bộ tiến độ lên Cloud Firestore</strong>. (Nếu để trống, ứng dụng sẽ chạy an toàn ở chế độ LocalStorage).
      </p>

      <div class="space-y-3 mb-6">
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">API Key</label>
          <input type="text" id="cfg-api-key" placeholder="AIzaSy..." class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Auth Domain</label>
          <input type="text" id="cfg-auth-domain" placeholder="project-id.firebaseapp.com" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Project ID</label>
          <input type="text" id="cfg-project-id" placeholder="project-id" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Storage Bucket</label>
          <input type="text" id="cfg-storage-bucket" placeholder="project-id.appspot.com" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Sender ID</label>
            <input type="text" id="cfg-messaging-sender-id" placeholder="123456..." class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">App ID</label>
            <input type="text" id="cfg-app-id" placeholder="1:1234:web:abc..." class="w-full text-xs p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white" />
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-3">
        <button id="btn-save-settings" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-colors shadow">
          Lưu Cấu Hình & Tải Lại
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== iOS 27 FLUID BUBBLE FLOATING DOCK ==================== -->
  <nav id="ios-bottom-bar" class="md:hidden fixed z-50 left-3 right-3 max-w-md mx-auto ios-floating-dock-container" style="bottom: calc(max(env(safe-area-inset-bottom, 0px), 12px) + 8px);">
    <div class="relative ios-bubble-capsule p-1.5 rounded-[26px] bg-slate-900/90 dark:bg-slate-950/90 backdrop-blur-2xl border border-slate-700/50 dark:border-white/10 shadow-[0_16px_40px_rgba(0,0,0,0.45)]">
      
      <!-- Fluid Spring Bubble Glider -->
      <div id="ios-bubble-glider" class="absolute top-1.5 bottom-1.5 pointer-events-none" style="width: calc((100% - 12px) / 4); left: 6px; transform: translate3d(0%, 0, 0);">
        <div id="ios-bubble-glider-pill" class="w-full h-full rounded-[20px] bg-gradient-to-tr from-indigo-500/25 via-indigo-600/20 to-purple-600/25 border border-indigo-400/40 shadow-[0_0_16px_rgba(99,102,241,0.3)]"></div>
      </div>

      <!-- Tab Buttons Grid -->
      <div class="relative z-10 grid grid-cols-4 items-center">
        <!-- Vocab Tab -->
        <button data-tab="vocab" data-tab-index="0" class="ios-tab-btn flex flex-col items-center justify-center py-1.5 group select-none">
          <div class="tab-icon-wrap transition-all duration-300 transform text-indigo-400 scale-105 -translate-y-0.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <rect x="3" y="4" width="18" height="15" rx="3" />
              <path d="M7 8h10M7 12h6" stroke-linecap="round" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-bold mt-1 tracking-tight transition-colors text-indigo-400">Từ Vựng</span>
        </button>

        <!-- Analytics Tab -->
        <button data-tab="analytics" data-tab-index="1" class="ios-tab-btn flex flex-col items-center justify-center py-1.5 group select-none">
          <div class="tab-icon-wrap transition-all duration-300 transform text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-1 tracking-tight transition-colors text-slate-400">Kỷ Luật</span>
        </button>

        <!-- Courses Tab -->
        <button data-tab="courses" data-tab-index="2" class="ios-tab-btn flex flex-col items-center justify-center py-1.5 group select-none">
          <div class="tab-icon-wrap transition-all duration-300 transform text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-1 tracking-tight transition-colors text-slate-400">Khoá Học</span>
        </button>

        <!-- Dictionary Tab -->
        <button data-tab="dictionary" data-tab-index="3" class="ios-tab-btn flex flex-col items-center justify-center py-1.5 group select-none">
          <div class="tab-icon-wrap transition-all duration-300 transform text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
            </svg>
          </div>
          <span class="tab-label text-[10px] font-medium mt-1 tracking-tight transition-colors text-slate-400">Sổ Tay</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ ServiceWorker đã sẵn sàng:', reg.scope))
          .catch(err => console.log('ServiceWorker lỗi:', err));
      });
    }
  </script>

  <!-- ES Modules Entrypoint -->
  <script type="module" src="./js/app.js?v=3.6"></script>
</body>
</html>
